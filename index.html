<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>قائمة الضيوف — حازم ورنيم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#50613f;--deep2:#3b4a2e;--acc:#6f7a52;--paper:#e8e2d6;--card:#f4f0e4;--line:#c9cfb3;--cream:#f3efe0;--soft:#d6dfbf;--no:#8a7f6b;--err:#9a4b3b}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;min-height:100vh;color:var(--deep);font:400 18px/1.6 'Amiri','Noto Naskh Arabic',serif;padding:0 0 env(safe-area-inset-bottom,0)}
.hero{background:linear-gradient(var(--deep),var(--deep2));color:var(--cream);text-align:center;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 72px}
.hero .mono{font:700 34px/1 'Amiri',serif;color:var(--soft);letter-spacing:6px}
.hero h1{font:700 46px/1.25 'Amiri',serif;color:var(--cream);margin:8px 0 2px}
.hero p{margin:0;font:400 17px 'Amiri',serif;color:var(--soft)}
.wrap{max-width:660px;margin:-46px auto 0;padding:0 16px 48px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:14px 6px 10px;text-align:center;box-shadow:0 8px 22px #3b4a2e22}
.stat b{display:block;font:700 34px/1.2 'Amiri',serif;color:var(--deep)}
.stat span{font:400 15px 'Amiri',serif;color:var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.tools input{flex:1 1 100%;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:#fffdf6;font:400 18px 'Amiri',serif;color:var(--deep);outline:none}
.tools input:focus{border-color:var(--acc)}
button{font:700 16px 'Amiri',serif;cursor:pointer;border:1px solid var(--acc);background:transparent;color:var(--deep);border-radius:999px;padding:6px 16px}
button:hover{background:#dfe5cc}
.tab.active{background:var(--deep);color:var(--cream);border-color:var(--deep)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.who{min-width:0}.who strong{display:block;font:700 21px/1.3 'Amiri',serif;color:var(--deep);overflow-wrap:anywhere}
.who small{font:400 14px 'Amiri',serif;color:var(--acc)}
.badge{white-space:nowrap;font:700 15px 'Amiri',serif;padding:4px 14px;border-radius:999px}
.badge.ok{background:var(--deep);color:var(--cream)}
.badge.no{background:transparent;color:var(--no);border:1px solid var(--no)}
.empty{text-align:center;padding:34px 0;color:var(--acc)}
#status{text-align:center;color:var(--acc);font-size:17px;margin-top:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="hero"><div class="mono"> </div><h1>قائمة الضيوف</h1><p>حازم ورنيم، السبت ٢٨ نوفمبر ٢٠٢٦</p></header>

<div class="wrap" id="app">
 <div class="stats">
  <div class="stat"><b id="sAttend">٠</b><span>عدد الحضور</span></div>
  <div class="stat"><b id="sYes">٠</b><span>ردّوا بالحضور</span></div>
  <div class="stat"><b id="sNo">٠</b><span>معتذرون</span></div>
 </div>
 <div class="tools">
  <input id="q" type="search" placeholder="ابحثي بالاسم…" aria-label="بحث بالاسم">
  <button class="tab active" data-f="all">الكل</button>
  <button class="tab" data-f="yes">حاضرون</button>
  <button class="tab" data-f="no">معتذرون</button>
  <button id="copyBtn" type="button">نسخ الأسماء</button>
  <button id="exportBtn" type="button">تصدير CSV</button>
 </div>
 <ul id="list"></ul>
 <div id="status">جاري التحميل…</div>
</div>

<script>
var all=[],filter='all';
function $(id){return document.getElementById(id)}
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
function isYes(r){return r.status==='Attending'}
function fmtTime(ts){if(!ts)return'';try{return ts.toDate().toLocaleString('ar',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}catch(_){return''}}
function getFiltered(){var t=$('q').value.trim().toLowerCase();return all.filter(function(r){return(filter==='all'||(filter==='yes')===isYes(r))&&(!t||(r.name||'').toLowerCase().indexOf(t)>-1)})}
function render(){
 var yes=all.filter(isYes),no=all.filter(function(r){return!isYes(r)});
 $('sAttend').textContent=ar(yes.reduce(function(n,r){return n+(r.guestsCount||1)},0));
 $('sYes').textContent=ar(yes.length);$('sNo').textContent=ar(no.length);
 var rows=getFiltered(),ul=$('list');ul.innerHTML='';
 if(!rows.length){var d=document.createElement('div');d.className='empty';d.textContent=all.length?'ما في نتائج':'ما وصل أي ردّ بعد';ul.appendChild(d);return}
 rows.forEach(function(r){
  var li=document.createElement('li'),who=document.createElement('div');who.className='who';
  var n=document.createElement('strong');n.textContent=r.name||'(بدون اسم)';
  var t=document.createElement('small');t.textContent=fmtTime(r.createdAt);who.append(n,t);
  var b=document.createElement('span'),y=isYes(r);b.className='badge '+(y?'ok':'no');b.textContent=y?('حاضر ('+ar(r.guestsCount||1)+')'):'معتذر';
  li.append(who,b);ul.appendChild(li)})}
window.__setData=function(rows){all=rows;$('status').textContent='';render()};
window.__status=function(t){$('status').textContent=t};
window.__cfgMissing=function(){$('status').textContent='لازم تضعي إعدادات Firebase داخل ملف الصفحة (أعلى سكربت الـ module) حتى تشتغل.'};
$('q').addEventListener('input',render);
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');filter=b.dataset.f;render()})});
$('copyBtn').addEventListener('click',function(){
 var lines=getFiltered().map(function(r){return(r.name||'(بدون اسم)')+' - '+(isYes(r)?'حاضر ('+ar(r.guestsCount||1)+')':'معتذر')});
 var done=function(t){$('copyBtn').textContent=t;setTimeout(function(){$('copyBtn').textContent='نسخ الأسماء'},1800)};
 (navigator.clipboard?navigator.clipboard.writeText(lines.join('\n')):Promise.reject()).then(function(){done('تم النسخ ✓')},function(){done('تعذّر النسخ')})});
$('exportBtn').addEventListener('click',function(){
 var rows=getFiltered();if(!rows.length){alert('ما في شي للتصدير');return}
 var csv='\uFEFFالاسم,الحالة,عدد الضيوف,التاريخ\n';
 rows.forEach(function(r){var y=isYes(r);csv+='"'+(r.name||'(بدون اسم)').replace(/"/g,'""')+'",'+(y?'حاضر':'معتذر')+','+(y?(r.guestsCount||1):0)+',"'+fmtTime(r.createdAt)+'"\n'});
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='guest_list_'+filter+'_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a)});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

/* ضعي هنا إعدادات مشروع Firebase الخاص بكم (Project settings ← Your apps ← Web app ← Config) */
const FIREBASE = { apiKey: "AIzaSyBxzEKOQ8NrNqgeJp1XePLEsbEKXdXHla4", authDomain: "my-wedding-cards.firebaseapp.com", projectId: "my-wedding-cards", appId: "1:844853477189:web:0866c7b5e13b877e20482c" };
const COLLECTION = "rsvp_hazem_raneem";   // لازم يكون نفس الاسم المستخدم بالدعوة

if (!FIREBASE.apiKey || !FIREBASE.projectId) {
  window.__cfgMissing();
} else {
  const db = getFirestore(initializeApp(FIREBASE));
  onSnapshot(query(collection(db, COLLECTION), orderBy("createdAt", "desc")),
    function (snap) { window.__setData(snap.docs.map(function (d) { return d.data(); })); },
    function (err) { console.error(err); window.__status("ما قدرنا نحمّل الردود. تأكدي من اسم المجموعة وقواعد Firebase."); });
}
</script>
</body>
</html>
